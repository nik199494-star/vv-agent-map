name: Подготовить пакет обновления карты

on:
  pull_request:
    paths:
      - '.github/workflows/prepare-demand-package.yml'
      - 'scripts/**'
      - 'test/demand-package.test.mjs'
  push:
    branches: ['codex/demand-package-test']
    paths: ['.github/demand-package-test-request.json']
  workflow_dispatch:
    inputs:
      request_id:
        description: UUID из Паспорта preview, A2
        required: true
        type: string
      snapshot_id:
        description: ID принятого снимка из листа «Снимки»
        required: true
        type: string
      hrm_date:
        description: Дата HRM в формате ДД.ММ.ГГГГ
        required: true
        type: string
      client:
        description: Клиент пакета (published — действующий, checkout — из выбранной ветки)
        required: true
        type: choice
        options: [published, checkout]
        default: published

permissions:
  contents: read

jobs:
  fixture:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/demand-package.test.mjs
      - name: Собрать проверочный пакет
        run: node scripts/demand-package.mjs fixture "${RUNNER_TEMP}/demand-fixture"
      - uses: actions/upload-artifact@v4
        with:
          name: demand-package-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demand-fixture/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  package:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/demand-package-test')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: demand-package
      deployment: false
    concurrency:
      group: vv-demand-package-sheets
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Сверить настройки испытательного доступа
        env:
          VV_PREVIEW_AGENT_ID: ${{ secrets.VV_PREVIEW_AGENT_ID }}
          VV_PREVIEW_SHEETS_READER: ${{ secrets.VV_PREVIEW_SHEETS_READER }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const digest = text => createHash('sha256').update('vv-demand-package-v1:' + text).digest('hex');
          const book = digest(process.env.VV_PREVIEW_AGENT_ID?.trim() ?? '') === '1a6005e9d7f17bac23881c006e823a962551d46bc6b2f9900fa76c759b6c1022';
          let reader = false;
          try {
            const key = JSON.parse(process.env.VV_PREVIEW_SHEETS_READER?.replace(/^\uFEFF/u, '') ?? 'null');
            reader = digest(key?.client_email ?? '') === '8b17b1d2221fc709622c56117c32c07d5c00a77b49e8fe1d29e08f799fe9a1dc';
          } catch {}
          console.log('VV_PREVIEW_AGENT_ID: ' + (book ? 'ID испытательной витрины совпадает.' : 'ID испытательной витрины не совпадает.'));
          console.log('VV_PREVIEW_SHEETS_READER: ' + (reader ? 'Ключ принадлежит зарегистрированному читателю.' : 'Ключ не принадлежит зарегистрированному читателю.'));
          if (!book || !reader) process.exitCode = 1;
          NODE
      - name: Сверить витрины и собрать пакет
        env:
          VV_PREVIEW_AGENT_ID: ${{ secrets.VV_PREVIEW_AGENT_ID }}
          VV_PREVIEW_SHEETS_READER: ${{ secrets.VV_PREVIEW_SHEETS_READER }}
        run: node scripts/demand-package.mjs sheets "${RUNNER_TEMP}/demand-package"
      - uses: actions/upload-artifact@v4
        with:
          name: demand-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demand-package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
